name: order-service

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders;Maximum Pool Size=40
  Jwt__Issuer: order-service
  Jwt__Audience: order-service-clients
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-me-1234567890}
  Jwt__LifetimeMinutes: 60
  Documentation__Enabled: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders;Maximum Pool Size=5
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo@123456}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1:
    build:
      context: .
      target: api
    environment:
      <<: *api-environment
      InstanceId: api-1
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 2s
      retries: 20

  api-2:
    build:
      context: .
      target: api
    environment:
      <<: *api-environment
      InstanceId: api-2
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 2s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
