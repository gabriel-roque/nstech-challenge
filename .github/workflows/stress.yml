name: Stress

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build --detach postgres api-1 api-2 nginx

      - name: Run five-minute stress profile
        run: docker compose --profile stress run --rm k6-stress

      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > stress-compose.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs
          path: stress-compose.log

      - name: Cleanup
        if: always()
        run: docker compose --profile stress down --volumes --remove-orphans

