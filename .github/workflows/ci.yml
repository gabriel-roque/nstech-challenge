name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore OrderService.slnx --locked-mode

      - name: Build
        run: dotnet build OrderService.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format OrderService.slnx --verify-no-changes --no-restore

      - name: Unit tests and coverage threshold
        run: >-
          dotnet test tests/OrderService.Domain.Tests/OrderService.Domain.Tests.csproj
          --configuration Release --no-build --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/TestResults/unit/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[OrderService.Domain]*%2c[OrderService.Application]*'
          '/p:Threshold=80%2c75'
          '/p:ThresholdType=line%2cbranch'
          /p:ThresholdStat=total

      - name: Architecture tests
        run: >-
          dotnet test tests/OrderService.Architecture.Tests/OrderService.Architecture.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger trx --results-directory TestResults/architecture

      - name: Integration and concurrency tests
        run: >-
          dotnet test tests/OrderService.Integration.Tests/OrderService.Integration.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger trx --results-directory TestResults/integration

      - name: Verify model has a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/OrderService.Infrastructure/OrderService.Infrastructure.csproj
          --startup-project src/OrderService.Api/OrderService.Api.csproj
          --configuration Release --no-build

      - name: Generate migration bundle
        run: >-
          dotnet ef migrations bundle
          --project src/OrderService.Infrastructure/OrderService.Infrastructure.csproj
          --startup-project src/OrderService.Api/OrderService.Api.csproj
          --configuration Release --no-build
          --target-runtime linux-x64
          --output TestResults/efbundle

      - name: Audit NuGet dependencies
        run: dotnet list OrderService.slnx package --vulnerable --include-transitive

      - name: Build and start Compose
        run: docker compose up --build --detach postgres api-1 api-2 nginx

      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify docs and both instances
        run: |
          curl --fail --silent http://localhost:8080/openapi/v1.json >/dev/null
          curl --fail --silent --location http://localhost:8080/scalar >/dev/null
          for attempt in {1..20}; do
            curl --fail --silent --dump-header - --output /dev/null http://localhost:8080/health/live
          done | tr -d '\r' | awk -F': ' 'tolower($1)=="x-instance-id" {print $2}' | sort -u > TestResults/instances.txt
          grep --fixed-strings api-1 TestResults/instances.txt
          grep --fixed-strings api-2 TestResults/instances.txt

      - name: k6 smoke
        run: docker compose --profile test run --rm k6-smoke

      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > TestResults/compose.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
