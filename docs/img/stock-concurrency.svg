<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Controle de concorrência de estoque com duas APIs</title>
  <desc id="desc">Demonstra como o PostgreSQL compartilhado serializa operações sobre o mesmo pedido e impede overselling quando pedidos diferentes disputam o mesmo produto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020617" flood-opacity=".36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker>
    <style>
      .title{font:700 32px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.section{font:700 16px Inter,Segoe UI,sans-serif;fill:#93c5fd;letter-spacing:.8px}.label{font:700 17px Inter,Segoe UI,sans-serif;fill:#f8fafc}.small{font:400 13px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.mono{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.chip{font:700 13px Inter,Segoe UI,sans-serif;fill:#f8fafc}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.wait{stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.ok{stroke:#34d399;stroke-width:2.5;fill:none;marker-end:url(#greenarrow)}.no{stroke:#fb7185;stroke-width:2.5;fill:none;marker-end:url(#redarrow)}
    </style>
  </defs>
  <rect width="1200" height="940" rx="28" fill="url(#bg)"/>
  <text class="title" x="55" y="61">Concorrência de estoque com duas instâncias da API</text>
  <text class="subtitle" x="55" y="91">A coordenação vive no PostgreSQL — nenhuma instância depende de mutex em memória</text>

  <g filter="url(#shadow)">
    <rect x="55" y="126" width="180" height="72" rx="17" fill="#083344" stroke="#22d3ee"/>
    <text class="label" x="145" y="158" text-anchor="middle">Nginx</text>
    <text class="small" x="145" y="180" text-anchor="middle">requisições simultâneas</text>
    <rect x="328" y="116" width="180" height="72" rx="17" fill="#172554" stroke="#60a5fa"/>
    <text class="label" x="418" y="148" text-anchor="middle">api-1</text>
    <text class="small" x="418" y="170" text-anchor="middle">transação A</text>
    <rect x="328" y="206" width="180" height="72" rx="17" fill="#172554" stroke="#60a5fa"/>
    <text class="label" x="418" y="238" text-anchor="middle">api-2</text>
    <text class="small" x="418" y="260" text-anchor="middle">transação B</text>
    <rect x="790" y="126" width="330" height="152" rx="20" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="955" y="163" text-anchor="middle">PostgreSQL compartilhado</text>
    <text class="small" x="955" y="191" text-anchor="middle">locks de linha + predicados atômicos</text>
    <text class="small" x="955" y="215" text-anchor="middle">constraints + commit/rollback</text>
    <rect x="864" y="237" width="182" height="24" rx="12" fill="#581c87"/>
    <text class="mono" x="955" y="254" text-anchor="middle">fonte única da verdade</text>
  </g>
  <path class="line" d="M235 151C270 151 284 152 320 152"/>
  <path class="line" d="M235 173C270 173 284 242 320 242"/>
  <path class="line" d="M508 152C618 152 662 172 782 172"/>
  <path class="line" d="M508 242C618 242 662 226 782 226"/>

  <line x1="55" y1="318" x2="1145" y2="318" stroke="#334155" stroke-width="2"/>
  <text class="section" x="55" y="356">CASO A · DUAS OPERAÇÕES SOBRE O MESMO PEDIDO</text>
  <text class="small" x="55" y="380">Evita dupla confirmação e resolve confirmação × cancelamento.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="407" width="205" height="74" rx="16" fill="#151d31" stroke="#60a5fa"/>
    <text class="chip" x="157" y="435" text-anchor="middle">api-1 adquire o lock</text>
    <text class="mono" x="157" y="460" text-anchor="middle">order FOR UPDATE</text>
    <rect x="322" y="407" width="205" height="74" rx="16" fill="#422006" stroke="#fbbf24"/>
    <text class="chip" x="424" y="435" text-anchor="middle">api-2 aguarda</text>
    <text class="small" x="424" y="460" text-anchor="middle">o mesmo row lock</text>
    <rect x="589" y="407" width="240" height="74" rx="16" fill="#064e3b" stroke="#34d399"/>
    <text class="chip" x="709" y="435" text-anchor="middle">api-1 aplica o efeito</text>
    <text class="small" x="709" y="460" text-anchor="middle">e executa COMMIT</text>
    <rect x="891" y="407" width="254" height="74" rx="16" fill="#151d31" stroke="#a78bfa"/>
    <text class="chip" x="1018" y="435" text-anchor="middle">api-2 relê o estado</text>
    <text class="small" x="1018" y="455" text-anchor="middle">idempotência, nova transição</text>
    <text class="small" x="1018" y="472" text-anchor="middle">válida ou 409</text>
  </g>
  <path class="wait" d="M260 444H314"/>
  <path class="ok" d="M527 444H581"/>
  <path class="line" d="M829 444H883"/>
  <rect x="308" y="503" width="584" height="39" rx="19" fill="#172033" stroke="#334155"/>
  <text class="small" x="600" y="528" text-anchor="middle">Resultado: uma transação por vez; a seguinte decide sobre o estado persistido</text>

  <line x1="55" y1="580" x2="1145" y2="580" stroke="#334155" stroke-width="2"/>
  <text class="section" x="55" y="618">CASO B · PEDIDOS DIFERENTES DISPUTAM O MESMO PRODUTO</text>
  <text class="small" x="55" y="642">O lock do pedido não basta aqui; a proteção está no UPDATE condicional executado pelo banco.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="669" width="260" height="99" rx="17" fill="#151d31" stroke="#60a5fa"/>
    <text class="chip" x="185" y="698" text-anchor="middle">api-1 · pedido A</text>
    <text class="mono" x="185" y="724" text-anchor="middle">stock 10 − 10</text>
    <text class="small" x="185" y="748" text-anchor="middle">1 linha afetada</text>
    <rect x="470" y="669" width="260" height="99" rx="17" fill="#151d31" stroke="#fbbf24"/>
    <text class="chip" x="600" y="698" text-anchor="middle">api-2 · pedido B</text>
    <text class="small" x="600" y="724" text-anchor="middle">aguarda o lock do produto</text>
    <text class="small" x="600" y="748" text-anchor="middle">predicado é reavaliado</text>
    <rect x="885" y="669" width="260" height="99" rx="17" fill="#4c0519" stroke="#fb7185"/>
    <text class="chip" x="1015" y="698" text-anchor="middle">estoque agora é 0</text>
    <text class="mono" x="1015" y="724" text-anchor="middle">0 &gt;= 10 → falso</text>
    <text class="small" x="1015" y="748" text-anchor="middle">0 linhas · ROLLBACK</text>
  </g>
  <path class="ok" d="M315 718H462"/>
  <path class="no" d="M730 718H877"/>

  <rect x="169" y="796" width="862" height="56" rx="18" fill="#0f172a" stroke="#22d3ee"/>
  <text class="mono" x="600" y="819" text-anchor="middle">UPDATE products SET available_quantity = available_quantity - @q</text>
  <text class="mono" x="600" y="841" text-anchor="middle">WHERE id = @id AND available_quantity &gt;= @q</text>

  <g>
    <rect x="55" y="881" width="253" height="34" rx="17" fill="#064e3b"/><text class="small" x="181" y="903" text-anchor="middle">CHECK: estoque nunca negativo</text>
    <rect x="323" y="881" width="253" height="34" rx="17" fill="#172554"/><text class="small" x="449" y="903" text-anchor="middle">itens ordenados por product_id</text>
    <rect x="591" y="881" width="253" height="34" rx="17" fill="#3b0764"/><text class="small" x="717" y="903" text-anchor="middle">retry de deadlock: 3 + jitter</text>
    <rect x="859" y="881" width="286" height="34" rx="17" fill="#422006"/><text class="small" x="1002" y="903" text-anchor="middle">falha em um item → rollback total</text>
  </g>
</svg>
