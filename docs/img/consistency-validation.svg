<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo da validação distribuída de consistência e ACID</title>
  <desc id="desc">Gatling envia requisições concorrentes pelo Nginx às duas APIs. O PostgreSQL coordena as transações. O script inspeciona o banco, testa durabilidade com reinício e produz relatórios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .title{font:700 32px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.label{font:700 18px Inter,Segoe UI,sans-serif;fill:#f8fafc}.small{font:400 13px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.mono{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.chip{font:600 13px Inter,Segoe UI,sans-serif;fill:#e2e8f0}.step{font:700 14px Inter,Segoe UI,sans-serif;fill:#f8fafc}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text class="title" x="55" y="61">Validação distribuída de consistência e ACID</text>

  <g filter="url(#shadow)">
    <rect x="55" y="139" width="190" height="112" rx="18" fill="#151d31" stroke="#fbbf24" stroke-width="2"/>
    <text class="label" x="150" y="177" text-anchor="middle">Gatling JS</text>
    <text class="small" x="150" y="203" text-anchor="middle">requisições simultâneas</text>
    <text class="mono" x="150" y="229" text-anchor="middle">verify-consistency.sh</text>

    <rect x="325" y="139" width="170" height="112" rx="18" fill="#151d31" stroke="#22d3ee" stroke-width="2"/>
    <text class="label" x="410" y="178" text-anchor="middle">Nginx</text>
    <text class="small" x="410" y="204" text-anchor="middle">localhost:8080</text>
    <text class="mono" x="410" y="229" text-anchor="middle">least_conn</text>

    <rect x="585" y="119" width="165" height="82" rx="17" fill="#151d31" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="667" y="155" text-anchor="middle">api-1</text>
    <text class="small" x="667" y="180" text-anchor="middle">X-Instance-Id</text>
    <rect x="585" y="220" width="165" height="82" rx="17" fill="#151d31" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="667" y="256" text-anchor="middle">api-2</text>
    <text class="small" x="667" y="281" text-anchor="middle">X-Instance-Id</text>

    <rect x="855" y="139" width="250" height="112" rx="18" fill="#151d31" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="980" y="177" text-anchor="middle">PostgreSQL</text>
    <text class="small" x="980" y="203" text-anchor="middle">locks · constraints · transações</text>
    <text class="mono" x="980" y="229" text-anchor="middle">fonte compartilhada da verdade</text>
  </g>

  <path class="line" d="M245 195H317"/>
  <path class="line" d="M495 177C535 177 541 160 577 160"/>
  <path class="line" d="M495 213C535 213 541 261 577 261"/>
  <path class="line" d="M750 160C802 160 805 180 847 180"/>
  <path class="line" d="M750 261C802 261 805 210 847 210"/>

  <text class="step" x="55" y="354">CENÁRIOS EXECUTADOS</text>
  <g>
    <rect x="55" y="380" width="252" height="62" rx="16" fill="#172554" stroke="#60a5fa"/>
    <text class="chip" x="181" y="407" text-anchor="middle">Mesma chave idempotente</text>
    <text class="small" x="181" y="428" text-anchor="middle">uma criação persistida</text>
    <rect x="323" y="380" width="252" height="62" rx="16" fill="#422006" stroke="#fbbf24"/>
    <text class="chip" x="449" y="407" text-anchor="middle">20 pedidos × 10 unidades</text>
    <text class="small" x="449" y="428" text-anchor="middle">sem overselling</text>
    <rect x="591" y="380" width="252" height="62" rx="16" fill="#4c0519" stroke="#fb7185"/>
    <text class="chip" x="717" y="407" text-anchor="middle">Confirmar × cancelar</text>
    <text class="small" x="717" y="428" text-anchor="middle">um único efeito final</text>
    <rect x="859" y="380" width="286" height="62" rx="16" fill="#3b0764" stroke="#a78bfa"/>
    <text class="chip" x="1002" y="407" text-anchor="middle">Produtos em ordens opostas</text>
    <text class="small" x="1002" y="428" text-anchor="middle">contenção e retry de deadlock</text>

    <rect x="189" y="461" width="252" height="62" rx="16" fill="#052e2b" stroke="#2dd4bf"/>
    <text class="chip" x="315" y="488" text-anchor="middle">Pedido multi-item inválido</text>
    <text class="small" x="315" y="509" text-anchor="middle">rollback de todos os itens</text>
    <rect x="457" y="461" width="252" height="62" rx="16" fill="#052e2b" stroke="#2dd4bf"/>
    <text class="chip" x="583" y="488" text-anchor="middle">Operações duplicadas</text>
    <text class="small" x="583" y="509" text-anchor="middle">sem efeitos repetidos</text>
    <rect x="725" y="461" width="286" height="62" rx="16" fill="#052e2b" stroke="#2dd4bf"/>
    <text class="chip" x="868" y="488" text-anchor="middle">SIGKILL + reinício do banco</text>
    <text class="small" x="868" y="509" text-anchor="middle">dados continuam legíveis</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="235" y="563" width="300" height="137" rx="20" fill="#151d31" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="385" y="602" text-anchor="middle">Inspeção SQL direta</text>
    <text class="small" x="385" y="630" text-anchor="middle">estoques · estados · totais</text>
    <text class="small" x="385" y="653" text-anchor="middle">fixtures · ausência de negativos</text>
    <rect x="308" y="668" width="154" height="22" rx="11" fill="#064e3b"/>
    <text class="mono" x="385" y="684" text-anchor="middle">docker compose exec</text>

    <rect x="665" y="563" width="300" height="137" rx="20" fill="#151d31" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="815" y="602" text-anchor="middle">Relatório por execução</text>
    <text class="small" x="815" y="630" text-anchor="middle">respostas · estado do banco</text>
    <text class="small" x="815" y="653" text-anchor="middle">sumário Markdown · HTML Gatling</text>
    <rect x="708" y="668" width="214" height="22" rx="11" fill="#064e3b"/>
    <text class="mono" x="815" y="684" text-anchor="middle">TestResults/consistency/</text>
  </g>
  <path class="dash" d="M150 251V320H28V632H227"/>
  <path class="dash" d="M980 251V320H1172V632H973"/>
  <path class="line" d="M535 632H657"/>
  <rect x="365" y="735" width="470" height="43" rx="21" fill="#064e3b" stroke="#34d399"/>
  <text class="chip" x="600" y="762" text-anchor="middle">PASS somente se HTTP e estado persistido forem consistentes</text>
</svg>
