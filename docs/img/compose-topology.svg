<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Topologia do ambiente Docker Compose</title>
  <desc id="desc">Cliente, k6 e Gatling acessam o Nginx na porta 8080. O Nginx distribui requisições entre duas APIs, que compartilham o PostgreSQL. Um migrator executa migrations e seed antes das APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 32px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.label{font:700 19px Inter,Segoe UI,sans-serif;fill:#f8fafc}.small{font:400 14px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.badge{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.note{font:600 15px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.flowlabel{font:600 12px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.line{stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text class="title" x="56" y="62">Docker Compose — topologia e recursos</text>
  <text class="subtitle" x="56" y="91">Uma porta pública, duas APIs balanceadas e um único banco transacional</text>

  <g filter="url(#shadow)">
    <rect x="55" y="235" width="190" height="142" rx="18" fill="#172033" stroke="#334155"/>
    <circle cx="92" cy="274" r="16" fill="#22d3ee" opacity=".18"/>
    <path d="M84 274h16M92 266v16" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="121" y="281">Clientes</text>
    <text class="small" x="79" y="319">Aplicação · curl</text>
    <text class="small" x="79" y="344">k6 · Gatling</text>

    <rect x="334" y="220" width="210" height="172" rx="18" fill="#172033" stroke="#22d3ee" stroke-width="2"/>
    <text class="label" x="439" y="266" text-anchor="middle">Nginx</text>
    <text class="small" x="439" y="295" text-anchor="middle">localhost:8080</text>
    <rect x="374" y="318" width="130" height="30" rx="15" fill="#083344"/>
    <text class="badge" x="439" y="338" text-anchor="middle">least_conn</text>
    <text class="badge" x="439" y="374" text-anchor="middle">0.25 CPU · 64 MiB</text>

    <rect x="641" y="132" width="250" height="150" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="681" cy="173" r="18" fill="#1d4ed8"/>
    <text class="badge" x="681" y="178" text-anchor="middle">1</text>
    <text class="label" x="714" y="179">api-1</text>
    <text class="small" x="681" y="215">ASP.NET Core · Npgsql</text>
    <text class="badge" x="681" y="252">2.00 CPU · 512 MiB</text>

    <rect x="641" y="331" width="250" height="150" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="681" cy="372" r="18" fill="#1d4ed8"/>
    <text class="badge" x="681" y="377" text-anchor="middle">2</text>
    <text class="label" x="714" y="378">api-2</text>
    <text class="small" x="681" y="414">ASP.NET Core · Npgsql</text>
    <text class="badge" x="681" y="451">2.00 CPU · 512 MiB</text>

    <rect x="972" y="220" width="180" height="172" rx="18" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <ellipse cx="1062" cy="267" rx="31" ry="12" fill="#6d28d9"/>
    <path d="M1031 267v46c0 7 14 12 31 12s31-5 31-12v-46" fill="#6d28d9" opacity=".55"/>
    <ellipse cx="1062" cy="290" rx="31" ry="12" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <ellipse cx="1062" cy="313" rx="31" ry="12" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <text class="label" x="1062" y="354" text-anchor="middle">PostgreSQL</text>
    <text class="badge" x="1062" y="378" text-anchor="middle">0.75 CPU · 512 MiB</text>

    <rect x="641" y="539" width="250" height="92" rx="18" fill="#172033" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="676" y="577">Migrator</text>
    <text class="badge" x="676" y="607">0.50 CPU · 256 MiB</text>
    <rect x="813" y="557" width="56" height="25" rx="12" fill="#064e3b"/>
    <text class="badge" x="841" y="574" text-anchor="middle">1×</text>
  </g>

  <path class="line" d="M245 306H326"/>
  <path class="line" d="M544 280H570Q585 280 585 265V222Q585 207 600 207H633"/>
  <path class="line" d="M544 332H570Q585 332 585 347V391Q585 406 600 406H633"/>
  <path class="line" d="M891 207H908Q923 207 923 222V260Q923 275 938 275H964"/>
  <path class="line" d="M891 406H908Q923 406 923 391V352Q923 337 938 337H964"/>
  <path class="line" d="M891 585H927Q942 585 942 570V465Q942 450 957 450H1035Q1050 450 1050 435V401"/>

  <g>
    <rect x="263" y="274" width="54" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
    <text class="flowlabel" x="290" y="290" text-anchor="middle">HTTP</text>

    <rect x="545" y="293" width="90" height="27" rx="13" fill="#0f172a" stroke="#334155"/>
    <text class="flowlabel" x="590" y="311" text-anchor="middle">distribuição</text>

    <rect x="895" y="164" width="82" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text class="flowlabel" x="936" y="181" text-anchor="middle">pool ≤ 40</text>

    <rect x="895" y="418" width="82" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text class="flowlabel" x="936" y="435" text-anchor="middle">pool ≤ 40</text>

    <rect x="953" y="471" width="144" height="27" rx="13" fill="#0f172a" stroke="#334155"/>
    <text class="flowlabel" x="1025" y="489" text-anchor="middle">migration + seed</text>
  </g>

  <rect x="55" y="537" width="500" height="94" rx="18" fill="#0f172a" stroke="#334155"/>
  <text class="note" x="82" y="575">Teto em operação normal</text>
  <text class="label" x="82" y="606">5 CPUs · 1,56 GiB RAM · swap desabilitado</text>
  <text class="small" x="55" y="665">Host recomendado: pelo menos 6 CPUs lógicas e 3 GiB disponíveis</text>
</svg>
