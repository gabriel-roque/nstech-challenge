<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral da arquitetura e confirmação transacional</title>
  <desc id="desc">Mostra as dependências entre API, Application, Domain, Infrastructure e Migrator, além do fluxo transacional usado para confirmar um pedido e atualizar estoque.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#020617" flood-opacity=".36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .title{font:700 32px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.section{font:700 16px Inter,Segoe UI,sans-serif;fill:#93c5fd;letter-spacing:1px}.label{font:700 18px Inter,Segoe UI,sans-serif;fill:#f8fafc}.small{font:400 13px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.mono{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.success{stroke:#34d399;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.fail{stroke:#fb7185;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text class="title" x="55" y="61">Arquitetura e caminho crítico do estoque</text>
  <text class="subtitle" x="55" y="91">Dependências voltadas ao domínio; consistência delegada à transação compartilhada</text>
  <line x1="600" y1="128" x2="600" y2="700" stroke="#334155" stroke-width="2"/>

  <text class="section" x="55" y="150">DEPENDÊNCIAS DO CÓDIGO</text>
  <g filter="url(#shadow)">
    <rect x="75" y="183" width="455" height="100" rx="18" fill="#151d31" stroke="#22d3ee"/>
    <rect x="98" y="207" width="182" height="52" rx="13" fill="#083344" stroke="#22d3ee"/>
    <text class="label" x="189" y="239" text-anchor="middle">API</text>
    <rect x="326" y="207" width="182" height="52" rx="13" fill="#052e2b" stroke="#34d399"/>
    <text class="label" x="417" y="239" text-anchor="middle">Migrator</text>
    <text class="small" x="302" y="274" text-anchor="middle">composition roots</text>

    <rect x="98" y="348" width="404" height="90" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="300" y="382" text-anchor="middle">Application</text>
    <text class="small" x="300" y="409" text-anchor="middle">casos de uso · DTOs · portas</text>

    <rect x="151" y="503" width="298" height="104" rx="20" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="300" y="543" text-anchor="middle">Domain</text>
    <text class="small" x="300" y="570" text-anchor="middle">aggregates · invariantes</text>
    <text class="small" x="300" y="592" text-anchor="middle">zero dependências externas</text>

    <rect x="75" y="648" width="455" height="62" rx="16" fill="#3b0764" stroke="#a78bfa"/>
    <text class="label" x="166" y="686">Infrastructure</text>
    <text class="small" x="307" y="685">EF Core · Npgsql · autenticação</text>
  </g>
  <path class="line" d="M189 283V340"/>
  <path class="line" d="M417 283V340"/>
  <path class="line" d="M300 438V495"/>
  <path class="line" d="M300 648V616"/>
  <text class="small" x="55" y="733">As setas representam dependências em direção ao núcleo.</text>

  <text class="section" x="645" y="150">CONFIRMAÇÃO DO PEDIDO</text>
  <g filter="url(#shadow)">
    <rect x="666" y="181" width="430" height="58" rx="16" fill="#151d31" stroke="#60a5fa"/>
    <text class="label" x="698" y="216">1</text><text class="small" x="734" y="215">BEGIN · READ COMMITTED</text>
    <rect x="666" y="270" width="430" height="70" rx="16" fill="#151d31" stroke="#fbbf24"/>
    <text class="label" x="698" y="311">2</text><text class="mono" x="734" y="302">SELECT order FOR UPDATE</text>
    <text class="small" x="734" y="324">serializa operações sobre o mesmo pedido</text>
    <rect x="666" y="371" width="430" height="70" rx="16" fill="#151d31" stroke="#a78bfa"/>
    <text class="label" x="698" y="412">3</text><text class="small" x="734" y="402">Itens ordenados por product_id</text>
    <text class="small" x="734" y="424">ordem estável reduz ciclos de deadlock</text>
    <rect x="666" y="472" width="430" height="78" rx="16" fill="#151d31" stroke="#22d3ee"/>
    <text class="label" x="698" y="517">4</text><text class="mono" x="734" y="501">UPDATE products SET stock = stock - q</text>
    <text class="mono" x="734" y="525">WHERE stock &gt;= q</text>
    <rect x="760" y="591" width="144" height="70" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="832" y="620" text-anchor="middle">COMMIT</text>
    <text class="small" x="832" y="643" text-anchor="middle">todos = 1 linha</text>
    <rect x="952" y="591" width="144" height="70" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
    <text class="label" x="1024" y="620" text-anchor="middle">ROLLBACK</text>
    <text class="small" x="1024" y="643" text-anchor="middle">algum = 0 linhas</text>
  </g>
  <path class="line" d="M881 239V262"/>
  <path class="line" d="M881 340V363"/>
  <path class="line" d="M881 441V464"/>
  <path class="success" d="M825 550V583"/>
  <path class="fail" d="M1016 550V583"/>
  <rect x="645" y="688" width="475" height="42" rx="21" fill="#172033" stroke="#334155"/>
  <text class="small" x="882" y="714" text-anchor="middle">Deadlock: retry da transação inteira · máximo 3 · jitter</text>
</svg>
